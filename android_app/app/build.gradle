apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'

// Release signing reads from an untracked android_app/keystore.properties
// (storeFile/storePassword/keyAlias/keyPassword). Absent that file, release
// builds are simply unsigned — the repo never carries key material.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "se.lth.math.videoimucapture"
    compileSdkVersion 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "se.lth.math.videoimucapture"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 22
        versionName "0.22"

        // WHICH BUILD SHOT THIS. versionName alone cannot answer it: a version is bumped once
        // and then a dozen builds carry it, so two clips that behave differently can both say
        // "0.19" and the data has no way to tell them apart. That matters now more than it
        // ever has -- a matrix of paired cells is about to be shot, and a pair is only a
        // comparison if both halves came from the same binary.
        resValue "string", "git_sha", providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
        }.standardOutput.asText.map { it.trim() }.getOrElse("unknown")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Host-side tests run against a stub android.jar whose every method throws by default.
    // Returning defaults instead lets a test exercise real logic that happens to log -- which
    // is most of the logic worth testing here. Anything that genuinely depends on framework
    // behaviour belongs in androidTest on a device, not here.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}
dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    // A real org.json on the test classpath. The one in android.jar is a stub, and
    // returnDefaultValues would turn every put() into a no-op and every test that reads a
    // manifest back into a test of nothing.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'

    protobuf files("../../protobuf")

}
