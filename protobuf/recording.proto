syntax = "proto3";

// A note on `optional`, added 2026-09-02 after a field test.
//
// proto3 does not put a scalar on the wire when its value is the default, so a field
// holding 0 is byte-identical to a field never set. For most of this schema that is
// harmless. For a handful it was silently destroying the reading that mattered most:
// LENS_STATE 0 is STATIONARY (the state that says a frame's intrinsics can be trusted),
// THERMAL_STATUS 0 is NONE (the normal case, so the file could only ever say "throttling"),
// AE/AWB_STATE 0 is INACTIVE, TONEMAP_MODE 0 is CONTRAST_CURVE, and 0 lux is a dark room --
// which is exactly the condition this fork cares about measuring. Every one of those read
// back as "the device did not report it".
//
// `optional` on a proto3 scalar restores explicit presence, so a recorded 0 survives. It is
// wire-compatible: same field numbers, same encoding, and readers that predate the change
// parse these files unchanged.

import "google/protobuf/timestamp.proto";

package videoimu;

option java_package = "se.lth.math.videoimucapture";
option java_outer_classname = "RecordingProtos";

message CameraInfo {
  //fx, fy, cx, cy, s
  // See https://developer.android.com/reference/android/hardware/camera2/CameraCharacteristics#LENS_INTRINSIC_CALIBRATION
  // for details on how to use the intrinsics, pose_translation and pose_rotation.
  repeated float intrinsic_params = 1;
  //Radial: k1,k2,k3, Tangential: k4,k5
  repeated float distortion_params = 2;
  bool optical_image_stabilization = 3;
  bool video_stabilization = 4;
  bool distortion_correction = 10;
  int32 sensor_orientation = 14;

  enum FocusCalibration {
    UNCALIBRATED = 0;
    APPROXIMATE = 1;
    CALIBRATED = 2;
  }
  FocusCalibration focus_calibration = 5;

  enum TimestampSource {
    UNKNOWN = 0;
    REALTIME = 1;
  }
  TimestampSource timestamp_source = 6;

  enum LensPoseReference {
    PRIMARY_CAMERA = 0;
    GYROSCOPE = 1;
    UNDEFINED = 2;
  }
  LensPoseReference lens_pose_reference = 7;
  repeated float lens_pose_rotation = 8;
  repeated float lens_pose_translation = 9;

  message Size {
    int32 width = 1;
    int32 height = 2;
  }
  Size resolution = 11;
  Size pre_correction_active_array_size = 12; //SENSOR_INFO_PRE_CORRECTION_ACTIVE_ARRAY_SIZE
  repeated float original_intrinsic_params = 13;

}

message VideoFrameToTimestamp{
  int64 time_us = 1;
  int64 frame_nbr = 2;
}

message VideoFrameMetaData {
  int64 time_ns = 1;
  int64 frame_number = 2;
  int64 exposure_time_ns = 3;
  int64 frame_duration_ns = 4;
  int64 frame_readout_ns = 5;
  int32 iso = 6;
  float focal_length_mm = 7;
  float est_focal_length_pix = 8;
  float focus_distance_diopters = 9;

  message OISSample {
    int64 time_ns = 1;
    float x_shift = 2;
    float y_shift = 3;
  }
  repeated OISSample OIS_samples =10;
  bool focus_locked = 11;

  // SCALER_CROP_REGION, in active-array coordinates. If this moves frame to frame,
  // digital stabilization (EIS/VDIS) is warping the output — a per-frame EIS detector.
  message Rect {
    int32 left = 1;
    int32 top = 2;
    int32 right = 3;
    int32 bottom = 4;
  }
  Rect crop_region = 12;

  // Per-frame radiometry (ReconStab #39). All read from the CaptureResult that already arrives
  // for every frame, so these cost nothing to record and are what let a floating auto-exposure
  // (#28) be undone at bake time and what put a number behind the ISO ceiling (#38).
  repeated float color_correction_gains = 13;      // R, G_even, G_odd, B — the white-balance gains applied to THIS frame
  repeated float color_correction_transform = 14;  // 3x3 sensor-to-sRGB colour matrix, row-major
  optional int32 tonemap_mode = 15;                          // CONTROL_TONEMAP_MODE; a tone change mid-clip is otherwise invisible
  int32 post_raw_sensitivity_boost = 16;            // digital gain the HAL applied AFTER the sensor; ISO alone understates total gain
  repeated float dynamic_black_level = 17;          // SENSOR_DYNAMIC_BLACK_LEVEL, per CFA channel
  optional int32 ae_state = 18;                              // CONTROL_AE_STATE (searching/converged/locked/flash_required)
  optional int32 awb_state = 19;                             // CONTROL_AWB_STATE
  optional int32 ae_mode = 20;                               // CONTROL_AE_MODE (on/off) — says whether exposure was auto for this frame
  optional int32 awb_mode = 21;                              // CONTROL_AWB_MODE
  float lens_aperture = 22;                         // LENS_APERTURE (f-number); fixed on this phone, recorded per frame anyway
  optional int32 lens_state = 23;                            // LENS_STATE: 0 stationary, 1 moving — was the lens settling at the shutter
  repeated double noise_profile = 24;               // SENSOR_NOISE_PROFILE, flattened (S,O) pairs per channel — the noise model at this ISO
  // LENS_INTRINSIC_CALIBRATION as a PER-FRAME result (#31), where the HAL provides it dynamically
  // rather than only as a static characteristic: fx, fy, cx, cy, skew in sensor-array pixels. This
  // is the hardware's own focal for THIS frame — it moves with focus breathing, which a frozen
  // factory value cannot see, and is exactly what a focal-refining solve wants to compare against.
  // Empty on devices that only expose the static value.
  repeated float lens_intrinsic_calibration = 25;

  // Did the hardware stabilize this frame, and how (ReconStab #41)? The app REQUESTS a
  // stabilization mode; a request is not an answer. Only the HAL's own result key says what the
  // OIS motor and the digital warper actually did. Every gyro-derived blur kernel and every
  // rolling-shutter correction assumes the optical path did not move under the exposure -- if OIS
  // was live and unlogged, that assumption is quietly false and nothing downstream can tell.
  // `optional` because 0 is the reading that matters most here: OFF is the good news.
  optional int32 lens_optical_stabilization_mode = 26;  // LENS_OPTICAL_STABILIZATION_MODE: 0 OFF, 1 ON
  optional int32 video_stabilization_mode = 27;         // CONTROL_VIDEO_STABILIZATION_MODE: 0 OFF, 1 ON, 2 PREVIEW
  optional int32 distortion_correction_mode = 28;       // DISTORTION_CORRECTION_MODE: 0 OFF, 1 FAST, 2 HIGH_QUALITY
  // STATISTICS_OIS_DATA_MODE as the HAL reports it back. This device advertises no available OIS
  // data modes at all, which would mean the motor's actions can never be logged -- but "not
  // advertised" and "not supported" are different claims, and the request is made anyway (#44).
  // This field is how the difference becomes visible instead of assumed.
  optional int32 ois_data_mode = 29;                    // 0 OFF, 1 ON
  // CONTROL_AE_EXPOSURE_COMPENSATION in device units, as applied to THIS frame (#28). The
  // operator can now step exposure mid-recording without ending the session, so a clip may
  // carry more than one; without this field that step is an unexplained brightness jump, and
  // with it a bake can undo exactly what the operator asked for. `optional` because 0 -- no
  // compensation -- is the value most frames will honestly have.
  optional int32 ae_exposure_compensation = 30;
}

// Barometer sample. time_ns is the sensor event timestamp, same clock as IMUData.time_ns.
message EnvironmentData {
  int64 time_ns = 1;
  float pressure_hpa = 2;
}

// Heat, sampled every few seconds while recording, on the sensor clock (elapsedRealtimeNanos).
// The phone cooks after a minute or two under recording load and the barometer drifts with it;
// until this message the file could not say how hot it was when that happened.
//   battery_temp_c    the battery thermistor (ACTION_BATTERY_CHANGED), degrees C
//   thermal_status    PowerManager.THERMAL_STATUS_*: 0 none, 1 light, 2 moderate, 3 severe,
//                     4 critical, 5 emergency, 6 shutdown; -1 if the device predates API 29
//   thermal_headroom  PowerManager.getThermalHeadroom forecast, 1.0 = the throttling threshold;
//                     absent if the device predates API 30
message ThermalData {
  int64 time_ns = 1;
  float battery_temp_c = 2;
  optional int32 thermal_status = 3;
  float thermal_headroom = 4;
}

// Ambient light (ReconStab #39). The illumination the scene HAD, independent of what the camera
// chose to do about it — the other half of the exposure story of #38, and what lets a floating
// white balance (#28) be reasoned about. lux is TYPE_LIGHT; cct_k and ir come from Samsung's
// vendor light-CCT sensor where it exists, else 0/absent. On the sensor clock.
message LightData {
  int64 time_ns = 1;
  optional float lux = 2;
  float cct_k = 3;         // correlated colour temperature, Kelvin; 0 if the device has no CCT sensor
  float ir = 4;            // wide-IR channel, raw units; 0 if unavailable
}

// Raw GNSS measurements (ReconStab #39/#31/#35): per-satellite pseudorange rate, carrier phase,
// C/N0 and Doppler that post-processed positioning turns into decimetres where the fused fix
// gives 3.8 m — the biggest single upgrade available to the scale witness. One message per
// GnssMeasurementsEvent. time_ns is the GnssClock time; the fixes (GnssData) stay as they are.
message GnssMeasurementData {
  int64 time_ns = 1;              // GnssClock.getTimeNanos
  int64 full_bias_ns = 2;         // GnssClock.getFullBiasNanos, if set (else 0)
  double bias_ns = 3;             // GnssClock.getBiasNanos, if set
  double drift_nsps = 4;          // clock drift, ns per second, if set

  // The rest of GnssClock, added 2026-09-02. These are not completeness for its own sake:
  // without them a raw-measurement file cannot be post-processed, however clean the
  // measurements are.
  //
  // hardware_clock_discontinuity_count is the one that decides it. The receiver clock can
  // jump, and when it does the carrier-phase count restarts; a PPK solver that cannot see
  // the jump carries the break straight into the position. It must be recorded per epoch.
  optional int64 elapsed_realtime_ns = 6;        // getElapsedRealtimeNanos -- the SENSOR clock.
                                                 // This is what joins a GNSS epoch to a video
                                                 // frame; the fixes carry it, the raw
                                                 // measurements did not, which made them
                                                 // unjoinable to anything else in the file.
  optional double elapsed_realtime_uncertainty_ns = 7;
  optional int32 hardware_clock_discontinuity_count = 8;
  optional int32 leap_second = 9;
  optional double time_uncertainty_ns = 10;
  optional double bias_uncertainty_ns = 11;
  optional double drift_uncertainty_nsps = 12;

  message Measurement {
    int32 svid = 1;
    int32 constellation = 2;      // GnssStatus.CONSTELLATION_* (GPS=1, GLONASS=3, GALILEO=6, ...)
    double cn0_dbhz = 3;
    double pseudorange_rate_mps = 4;
    double pseudorange_rate_uncertainty_mps = 5;
    double accumulated_delta_range_m = 6;   // carrier phase
    int32 accumulated_delta_range_state = 7;
    double carrier_frequency_hz = 8;         // L1 vs L5 lives here — the dual-frequency signal
    int32 multipath_indicator = 9;
    int32 state = 10;
    double received_sv_time_ns = 11;

    // Added 2026-09-02, for the same reason as the clock fields above.
    //
    // time_offset_ns is the other one that decides it. Every measurement in an epoch is
    // taken at a slightly different instant, and this is that offset from the clock time.
    // RINEX observations are built from (clock time + this); without it every satellite in
    // the epoch is placed at the same instant, which is wrong by enough to matter at the
    // decimetre level the raw measurements exist to reach.
    optional double time_offset_ns = 12;
    optional int64 received_sv_time_uncertainty_ns = 13;
    optional double accumulated_delta_range_uncertainty_m = 14;
    // The observation code -- "C", "L", "I", "Q", "X" and so on. RINEX 3 names each
    // observation by band AND code, so a file without this cannot be written out as RINEX
    // without guessing which signal was tracked.
    optional string code_type = 15;
    // Post-correlation C/N0. Unlike cn0_dbhz it excludes antenna gain, which is what makes
    // it comparable across devices.
    optional double baseband_cn0_dbhz = 16;
    // Inter-signal biases: the hardware delay difference between this signal and the
    // reference one. Combining constellations or L1 with L5 without removing these leaves a
    // metres-level offset that looks exactly like a position error.
    optional double full_inter_signal_bias_ns = 17;
    optional double full_inter_signal_bias_uncertainty_ns = 18;
    optional double satellite_inter_signal_bias_ns = 19;
    optional double satellite_inter_signal_bias_uncertainty_ns = 20;
  }
  repeated Measurement measurements = 5;
}

// GNSS constellation health (ReconStab #39): how many satellites the fix actually used and their
// C/N0, so a 3.8 m accuracy claim can be read against a sky half-blocked by a lighthouse.
message GnssStatusData {
  int64 time_ns = 1;              // elapsedRealtimeNanos at the status callback
  int32 satellite_count = 2;
  int32 used_in_fix_count = 3;

  message Satellite {
    int32 svid = 1;
    int32 constellation = 2;
    float cn0_dbhz = 3;
    bool used_in_fix = 4;
    float elevation_deg = 5;
    float azimuth_deg = 6;
    float carrier_frequency_hz = 7; // 0 if not reported
  }
  repeated Satellite satellites = 4;
}

// Hardware step counter/detector. counter is cumulative since boot (TYPE_STEP_COUNTER);
// -1 for detector-only events (TYPE_STEP_DETECTOR).
message StepData {
  int64 time_ns = 1;
  int64 counter = 2;
  bool detector_event = 3;
}

// OS-fused orientation estimate (rotation vector family). DERIVED, not a raw measurement —
// recorded for cross-checks only, never as ground truth. sensor_type is the android
// Sensor type id (11 = ROTATION_VECTOR, 15 = GAME_ROTATION_VECTOR, 20 = GEOMAGNETIC).
message OrientationData {
  int64 time_ns = 1;
  repeated float quaternion = 2; // x, y, z, w as delivered by the sensor
  int32 sensor_type = 3;
  float heading_accuracy_rad = 4; // -1 if not reported
}

// One frame of a still burst (single shot, exposure bracket, or focus stack).
// Written per shot; shots of one burst share burst_id and count up in burst_index.
message StillMetaData {
  int64 time_ns = 1;              // SENSOR_TIMESTAMP, same clock as IMUData.time_ns
  int64 burst_id = 2;             // elapsedRealtimeNanos when the burst was requested
  int32 burst_index = 3;
  int32 burst_size = 4;

  enum BurstKind {
    SINGLE = 0;
    EXPOSURE_BRACKET = 1;
    FOCUS_STACK = 2;
  }
  BurstKind kind = 5;

  string jpeg_file = 6;           // basenames within the recording directory
  string dng_file = 7;

  int64 exposure_time_ns = 8;
  int32 iso = 9;
  float focus_distance_diopters = 10;
  float focal_length_mm = 11;
  int64 frame_duration_ns = 12;
  int64 frame_readout_ns = 13;
  float ev_offset = 14;           // stops from the metered/base exposure, for HDR merge
  string physical_camera_id = 15; // which lens, when driving a logical multi-camera

  // Orientation at the shutter instant, taken from the rotation-vector stream (x,y,z,w).
  // DERIVED (OS sensor fusion), not a measurement — but it is what lets a tripod pan be
  // stitched from known angles instead of by feature matching.
  repeated float orientation_quaternion = 16;
  int64 orientation_time_ns = 17; // timestamp of the sample actually used

  // Blur the stillness trigger PREDICTED when it decided to fire, in pixels
  // (focal_px * |omega| * exposure). The IMU stream is written alongside, so the
  // angular rate at this shot's own time_ns gives the blur ACHIEVED — predicted vs
  // achieved is the honest measure of whether firing on the downward crossing really
  // beat the shutter latency, rather than an assumption that it did.
  float predicted_blur_px = 18;
  float omega_at_trigger = 19;   // rad/s, the value the prediction used
  bool trigger_forced = 20;      // fired on the max-interval timeout, never went quiet
  int32 capture_mode = 21;       // 0 MANUAL, 1 WALK, 2 OBJECT, 3 PANO

  // Was the torch lit for this frame? Not cosmetic metadata: a torch-lit frame carries
  // a light source that MOVED WITH THE CAMERA, so its shading is a function of view
  // rather than of the scene. Anything solving for appearance has to know which frames
  // those are, and mixing lit and unlit frames of the same surface without knowing
  // which is which is how a reconstruction bakes the operator's flashlight into the
  // geometry.
  bool torch_on = 22;
  int32 torch_strength = 23;     // level if the device reports one, else 0

  // What the focus bracket ASKED for, against focus_distance_diopters which is what the
  // lens reported. A voice coil cannot slew arbitrarily fast, so a bracket can request a
  // step the lens has not reached by the time the shutter opens — measured on the first
  // build, where frame 0 of a full-range sweep came back at the previous focus. With the
  // two recorded separately that is detectable rather than invisible.
  float requested_focus_diopters = 24;

  // Which part of THIS lens's sensor the HAL actually read out, and what zoom the logical
  // camera was on. Recorded because the ultrawide half of the first stereo pair came back
  // framed identically to the main camera: factory intrinsics put its content 1.64x wider
  // (fx 1651 px on a 4000-wide array against 2755 px on 4080), and a scale search over the
  // real images peaked at 1.00 with the next-best candidate 3.5x down. Something between
  // the request and the sensor is cropping the wide lens to the narrow one's field of
  // view. These two fields are what turn that from an inference into a reading — if the
  // crop comes back as the physical sensor's full array and the frames still match, the
  // cause is upstream of the request and the next place to look is the stream
  // configuration.
  VideoFrameMetaData.Rect crop_region = 25;
  float zoom_ratio = 26;          // CONTROL_ZOOM_RATIO, 0 if the device does not report it

  // How long the lens took to arrive, and whether it did. A focus stack is only a stack if
  // the voice coil actually moved between frames; the first sequenced build records the
  // settle so a bracket that silently collapses is visible in the data rather than only in
  // the pixels.
  int64 focus_settle_ns = 27;
  bool focus_settled = 28;        // false => the shutter opened on a lens still in motion
}

// GNSS fix from LocationManager (GPS provider, no fused black box).
// elapsed_realtime_ns is on the same clock family as the sensor timestamps — that is the join.
// altitude is WGS84 ellipsoid metres, NOT geoid/MSL: geoid separation is ~30 m in New England.
message GnssData {
  int64 elapsed_realtime_ns = 1;
  int64 utc_time_ms = 2;
  double latitude_deg = 3;
  double longitude_deg = 4;
  double altitude_wgs84_m = 5;
  float horizontal_accuracy_m = 6;
  float vertical_accuracy_m = 7;
  float speed_mps = 8;
  float bearing_deg = 9;
  string provider = 10;
  bool has_altitude = 11;
  bool has_speed = 12;
  bool has_bearing = 13;
}

message IMUInfo {
  string gyro_info = 1;
  float gyro_resolution = 2;
  string accel_info = 3;
  float accel_resolution = 4;
  float sample_frequency = 5; //Hz
  repeated float placement = 6;

  // added for magnetometer support
  string mag_info = 7;
  float mag_resolution = 8;

  // added for barometer support
  string pressure_info = 9;
  float pressure_resolution = 10;

  // ReconStab #42. `sample_frequency` above is what ARRIVED; these are what was asked for and
  // what the hardware claimed it could do. A clip that records only the achieved rate cannot
  // distinguish "the app asked for too little" from "the sensor gave all it had", and the first
  // of those was true here for every clip before 2026-09-03: 200 Hz requested against a 416 Hz
  // part. Blur-kernel work reads these to know how many gyro samples span an exposure.
  optional int32 requested_period_us = 11;  // period passed to registerListener for gyro/accel
  optional int32 gyro_min_delay_us = 12;    // Sensor.getMinDelay(): the part's own claimed floor
  optional int32 accel_min_delay_us = 13;
  optional int32 mag_min_delay_us = 14;
}

message IMUData {
  int64 time_ns = 1;
  repeated float gyro = 2;
  repeated float gyro_drift = 3;
  repeated float accel = 4;
  repeated float accel_bias = 5;
  enum Accuracy {
    UNRELIABLE=0;
    LOW = 1;
    MEDIUM = 2;
    HIGH = 3;
  }
  Accuracy gyro_accuracy = 6;
  Accuracy accel_accuracy = 7;

  // added for magnetometer support
  repeated float mag = 8;
  repeated float mag_bias = 9;
  Accuracy mag_accuracy = 10;
}

// GNSS navigation messages (ReconStab, added 2026-09-02): the broadcast ephemeris, raw.
//
// Raw pseudoranges say how far each satellite was. They do not say where the satellite WAS,
// and without that a measurement file is a set of distances to unknown points. The orbit comes
// from the navigation message the satellite transmits, and this records those subframes
// verbatim so the clip carries its own orbits instead of depending on an IGS archive still
// serving that day years from now.
message GnssNavigationMessageData {
  int64 time_ns = 1;              // elapsedRealtimeNanos at the callback -- the sensor clock
  int32 svid = 2;
  int32 type = 3;                 // GnssNavigationMessage.TYPE_* (constellation + message type)
  int32 status = 4;               // STATUS_PARITY_PASSED / REBUILT / UNKNOWN
  int32 message_id = 5;           // -1 when not applicable
  int32 submessage_id = 6;
  bytes data = 7;                 // the raw subframe bytes, exactly as broadcast
}

// GNSS antenna geometry (ReconStab, added 2026-09-02). Device-static, written once per
// recording so the clip stands alone.
//
// Every position from these measurements is the position of the ANTENNA PHASE CENTRE, which
// is not where the phone is and is not the same place at L1 as at L5. At the metres level
// nobody cares. At the decimetres the raw measurements exist to reach, a few centimetres of
// unmodelled offset is a meaningful part of the error budget -- and it is a fixed, knowable
// offset, which makes leaving it out the easiest kind of mistake to stop making.
message GnssAntennaInfoData {
  double carrier_frequency_mhz = 1;
  double phase_center_offset_x_mm = 2;
  double phase_center_offset_y_mm = 3;
  double phase_center_offset_z_mm = 4;
  double phase_center_offset_x_uncertainty_mm = 5;
  double phase_center_offset_y_uncertainty_mm = 6;
  double phase_center_offset_z_uncertainty_mm = 7;
  // Present only when the vendor publishes correction grids; usually absent.
  bool has_phase_center_variation_corrections = 8;
  bool has_signal_gain_corrections = 9;
}

message VideoCaptureData {
  google.protobuf.Timestamp time = 1;
  CameraInfo camera_meta = 2;
  IMUInfo imu_meta = 3;

  repeated IMUData imu = 4;
  repeated VideoFrameMetaData video_meta = 5;
  repeated EnvironmentData environment = 6;
  repeated StepData steps = 7;
  repeated OrientationData orientation = 8;
  repeated GnssData gnss = 9;
  repeated StillMetaData stills = 10;
  repeated ThermalData thermal = 11;
  repeated LightData light = 12;
  repeated GnssMeasurementData gnss_measurement = 13;
  repeated GnssStatusData gnss_status = 14;
  repeated GnssNavigationMessageData gnss_navigation = 15;
  repeated GnssAntennaInfoData gnss_antenna = 16;
}

message MessageWrapper {
  oneof msg {
    CameraInfo camera_meta = 1;
    IMUData imu_data = 2;
    IMUInfo imu_meta = 3;
    VideoFrameMetaData frame_meta = 4;
    VideoFrameToTimestamp frame_time = 5;
    EnvironmentData environment_data = 6;
    StepData step_data = 7;
    OrientationData orientation_data = 8;
    GnssData gnss_data = 9;
    StillMetaData still_data = 10;
    ThermalData thermal_data = 11;
    LightData light_data = 12;
    GnssMeasurementData gnss_measurement_data = 13;
    GnssStatusData gnss_status_data = 14;
    GnssNavigationMessageData gnss_navigation_data = 15;
    GnssAntennaInfoData gnss_antenna_data = 16;
  }
}