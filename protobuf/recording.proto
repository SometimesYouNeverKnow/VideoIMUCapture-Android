syntax = "proto3";

import "google/protobuf/timestamp.proto";

package videoimu;

option java_package = "se.lth.math.videoimucapture";
option java_outer_classname = "RecordingProtos";

message CameraInfo {
  //fx, fy, cx, cy, s
  // See https://developer.android.com/reference/android/hardware/camera2/CameraCharacteristics#LENS_INTRINSIC_CALIBRATION
  // for details on how to use the intrinsics, pose_translation and pose_rotation.
  repeated float intrinsic_params = 1;
  //Radial: k1,k2,k3, Tangential: k4,k5
  repeated float distortion_params = 2;
  bool optical_image_stabilization = 3;
  bool video_stabilization = 4;
  bool distortion_correction = 10;
  int32 sensor_orientation = 14;

  enum FocusCalibration {
    UNCALIBRATED = 0;
    APPROXIMATE = 1;
    CALIBRATED = 2;
  }
  FocusCalibration focus_calibration = 5;

  enum TimestampSource {
    UNKNOWN = 0;
    REALTIME = 1;
  }
  TimestampSource timestamp_source = 6;

  enum LensPoseReference {
    PRIMARY_CAMERA = 0;
    GYROSCOPE = 1;
    UNDEFINED = 2;
  }
  LensPoseReference lens_pose_reference = 7;
  repeated float lens_pose_rotation = 8;
  repeated float lens_pose_translation = 9;

  message Size {
    int32 width = 1;
    int32 height = 2;
  }
  Size resolution = 11;
  Size pre_correction_active_array_size = 12; //SENSOR_INFO_PRE_CORRECTION_ACTIVE_ARRAY_SIZE
  repeated float original_intrinsic_params = 13;

}

message VideoFrameToTimestamp{
  int64 time_us = 1;
  int64 frame_nbr = 2;
}

message VideoFrameMetaData {
  int64 time_ns = 1;
  int64 frame_number = 2;
  int64 exposure_time_ns = 3;
  int64 frame_duration_ns = 4;
  int64 frame_readout_ns = 5;
  int32 iso = 6;
  float focal_length_mm = 7;
  float est_focal_length_pix = 8;
  float focus_distance_diopters = 9;

  message OISSample {
    int64 time_ns = 1;
    float x_shift = 2;
    float y_shift = 3;
  }
  repeated OISSample OIS_samples =10;
  bool focus_locked = 11;

  // SCALER_CROP_REGION, in active-array coordinates. If this moves frame to frame,
  // digital stabilization (EIS/VDIS) is warping the output — a per-frame EIS detector.
  message Rect {
    int32 left = 1;
    int32 top = 2;
    int32 right = 3;
    int32 bottom = 4;
  }
  Rect crop_region = 12;
}

// Barometer sample. time_ns is the sensor event timestamp, same clock as IMUData.time_ns.
message EnvironmentData {
  int64 time_ns = 1;
  float pressure_hpa = 2;
}

// Hardware step counter/detector. counter is cumulative since boot (TYPE_STEP_COUNTER);
// -1 for detector-only events (TYPE_STEP_DETECTOR).
message StepData {
  int64 time_ns = 1;
  int64 counter = 2;
  bool detector_event = 3;
}

// OS-fused orientation estimate (rotation vector family). DERIVED, not a raw measurement —
// recorded for cross-checks only, never as ground truth. sensor_type is the android
// Sensor type id (11 = ROTATION_VECTOR, 15 = GAME_ROTATION_VECTOR, 20 = GEOMAGNETIC).
message OrientationData {
  int64 time_ns = 1;
  repeated float quaternion = 2; // x, y, z, w as delivered by the sensor
  int32 sensor_type = 3;
  float heading_accuracy_rad = 4; // -1 if not reported
}

// One frame of a still burst (single shot, exposure bracket, or focus stack).
// Written per shot; shots of one burst share burst_id and count up in burst_index.
message StillMetaData {
  int64 time_ns = 1;              // SENSOR_TIMESTAMP, same clock as IMUData.time_ns
  int64 burst_id = 2;             // elapsedRealtimeNanos when the burst was requested
  int32 burst_index = 3;
  int32 burst_size = 4;

  enum BurstKind {
    SINGLE = 0;
    EXPOSURE_BRACKET = 1;
    FOCUS_STACK = 2;
  }
  BurstKind kind = 5;

  string jpeg_file = 6;           // basenames within the recording directory
  string dng_file = 7;

  int64 exposure_time_ns = 8;
  int32 iso = 9;
  float focus_distance_diopters = 10;
  float focal_length_mm = 11;
  int64 frame_duration_ns = 12;
  int64 frame_readout_ns = 13;
  float ev_offset = 14;           // stops from the metered/base exposure, for HDR merge
  string physical_camera_id = 15; // which lens, when driving a logical multi-camera

  // Orientation at the shutter instant, taken from the rotation-vector stream (x,y,z,w).
  // DERIVED (OS sensor fusion), not a measurement — but it is what lets a tripod pan be
  // stitched from known angles instead of by feature matching.
  repeated float orientation_quaternion = 16;
  int64 orientation_time_ns = 17; // timestamp of the sample actually used
}

// GNSS fix from LocationManager (GPS provider, no fused black box).
// elapsed_realtime_ns is on the same clock family as the sensor timestamps — that is the join.
// altitude is WGS84 ellipsoid metres, NOT geoid/MSL: geoid separation is ~30 m in New England.
message GnssData {
  int64 elapsed_realtime_ns = 1;
  int64 utc_time_ms = 2;
  double latitude_deg = 3;
  double longitude_deg = 4;
  double altitude_wgs84_m = 5;
  float horizontal_accuracy_m = 6;
  float vertical_accuracy_m = 7;
  float speed_mps = 8;
  float bearing_deg = 9;
  string provider = 10;
  bool has_altitude = 11;
  bool has_speed = 12;
  bool has_bearing = 13;
}

message IMUInfo {
  string gyro_info = 1;
  float gyro_resolution = 2;
  string accel_info = 3;
  float accel_resolution = 4;
  float sample_frequency = 5; //Hz
  repeated float placement = 6;

  // added for magnetometer support
  string mag_info = 7;
  float mag_resolution = 8;

  // added for barometer support
  string pressure_info = 9;
  float pressure_resolution = 10;
}

message IMUData {
  int64 time_ns = 1;
  repeated float gyro = 2;
  repeated float gyro_drift = 3;
  repeated float accel = 4;
  repeated float accel_bias = 5;
  enum Accuracy {
    UNRELIABLE=0;
    LOW = 1;
    MEDIUM = 2;
    HIGH = 3;
  }
  Accuracy gyro_accuracy = 6;
  Accuracy accel_accuracy = 7;

  // added for magnetometer support
  repeated float mag = 8;
  repeated float mag_bias = 9;
  Accuracy mag_accuracy = 10;
}

message VideoCaptureData {
  google.protobuf.Timestamp time = 1;
  CameraInfo camera_meta = 2;
  IMUInfo imu_meta = 3;

  repeated IMUData imu = 4;
  repeated VideoFrameMetaData video_meta = 5;
  repeated EnvironmentData environment = 6;
  repeated StepData steps = 7;
  repeated OrientationData orientation = 8;
  repeated GnssData gnss = 9;
  repeated StillMetaData stills = 10;
}

message MessageWrapper {
  oneof msg {
    CameraInfo camera_meta = 1;
    IMUData imu_data = 2;
    IMUInfo imu_meta = 3;
    VideoFrameMetaData frame_meta = 4;
    VideoFrameToTimestamp frame_time = 5;
    EnvironmentData environment_data = 6;
    StepData step_data = 7;
    OrientationData orientation_data = 8;
    GnssData gnss_data = 9;
    StillMetaData still_data = 10;
  }
}